<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EdgeBox · 设备管理</title><link rel="stylesheet" href="/style.css"><script defer src="/ui.js"></script><script defer src="/app.js"></script></head><body><header><span class="mark">E</span><div><strong>EdgeBox</strong><small>我的网络盒子</small></div><button id="logout" hidden>退出登录</button></header><main><section id="login"><h1>登录管理页面</h1><p>用户名为 admin，使用你设置的网页管理密码。</p><form id="login-form"><label>用户名<input name="username" value="admin" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label><button>登录</button></form><p class="muted">忘记密码时，请联系维护人员通过盒子的管理连接重设。这里没有免密码重置入口。</p></section><section id="console" hidden><nav><button data-page="dashboard">设备概览</button><button data-page="nodes">加速节点</button><button data-page="diagnostics">网络检查</button><button data-page="settings">设置</button><button data-page="updates">软件更新</button></nav><div id="page"></div></section><p id="message" role="status" aria-live="polite"></p></main><footer>连接盒子热点后，即使手机没有互联网也能打开这个页面</footer></body></html>
